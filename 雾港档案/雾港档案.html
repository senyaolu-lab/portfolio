// ── 动作：问话 ─────────────────────────────────────────────
function askTopic(topic, target, label) {
  return runAsk({ topic, target, playerText: label });
}

async function askFreeText(text) {
  if (app.busy || !E.canAct(app.game)) return;
  const s = E.suspectOf(app.game, app.active);
  let routed = classifyIntent(text, s, app.game.case.suspects);
  if (routed.confidence === 'low' && isLLM(app.settings)) {
    const better = await routeByLLM(app.settings, { text, suspect: s });
    if (better) routed = { ...routed, topic: better, confidence: 'high' };
  }
  return runAsk({ topic: routed.topic, target: routed.target, playerText: text });
}

async function runAsk({ topic, target, playerText }) {
  if (app.busy || !E.canAct(app.game)) return;
  const g = app.game;
  const sid = app.active;
  const s = E.suspectOf(g, sid);
  const before = g.state.timeLeft;

  app.busy = true;
  renderChips();
  pushMsg(sid, { who: 'you', text: playerText || '（沉默）' });
  sfx.send();

  const res = E.ask(g, sid, topic, target);
  if (!res.ok) {
    app.busy = false;
    renderChips();
    return;
  }
  sfx.hour();
  const thinking = { who: 'them', name: s.name, thinking: true, text: '' };
  pushMsg(sid, thinking);

  const rendered = await renderUtterance(app.settings, {
    suspect: s,
    lines: res.lines,
    mood: res.mood,
    playerText,
    scene: sceneInfo(g),
  });
  if (rendered.source === 'local' && isLLM(app.settings)) app.degraded = true;
  else if (rendered.source === 'llm') app.degraded = false;

  finishThinking(sid, {
    who: 'them',
    name: s.name,
    text: rendered.text,
    t: `剩 ${g.state.timeLeft}h`,
  });

  if (res.hint) {
    ticker(`${s.name} 的口风：${res.hint.text}`);
  } else {
    ticker(`「${s.name}」— ${MOOD[res.mood]} · 消耗 ${before - g.state.timeLeft}h`);
  }
  if (res.confessed) sfx.crack();

  app.busy = false;
  save();
  renderAll({ feed: false });
}

function finishThinking(sid, msg) {
  const g = app.game;
  const list = g.state.transcripts[sid] || [];
  const idx = list.findIndex((m) => m.thinking);
  if (idx >= 0) list[idx] = msg;
  else list.push(msg);
  const feed = $('feed');
  const nodes = feed.querySelectorAll('.msg.them');
  const node = nodes[nodes.length - 1];
  if (node) {
    const bubble = node.querySelector('.bubble');
    node.querySelector('.who-line').textContent = `${msg.name} · ${msg.t}`;
    typewriter(bubble, msg.text);
    feed.scrollTop = feed.scrollHeight;
  }
}

function typewriter(el, text) {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || text.length > 150) {
    el.textContent = text;
    return;
  }
  el.textContent = '';
  el.classList.add('typing');
  let i = 0;
  const step = Math.max(14, Math.min(30, 1100 / Math.max(1, text.length)));
  const tick = () => {
    el.textContent = text.slice(0, ++i);
    const feed = $('feed');
    feed.scrollTop = feed.scrollHeight;
    if (i < text.length) setTimeout(tick, step);
    else el.classList.remove('typing');
  };
  setTimeout(tick, 120);
}

// ── 动作：搜查 ─────────────────────────────────────────────
function doSearch(locId) {
  const g = app.game;
  if (!E.canAct(g)) return;
  const res = E.searchLocation(g, locId);
  if (!res.ok) {
    if (res.reason === 'time') ticker('时间不够了。');
    if (res.reason === 'already') ticker(res.message);
    return;
  }
  sfx.clue();
  save();
  renderAll();
  const loc = g.case.locations.find((l) => l.id === locId);
  const html = `
    <h2 class="modal-h">${esc(loc.name)}</h2>
    <p class="modal-sub">耗费 ${res.spent} 小时。找到 ${res.clues.length} 件东西。</p>
    <ul class="found">
      ${res.clues
        .map(
          (c) => `<li class="found-item">
            <span class="clue-kind k-${c.kind}">${KIND[c.kind] || '物证'}</span>
            <b>${esc(c.name)}</b>
            <p>${esc(c.detail)}</p>
          </li>`,
        )
        .join('')}
    </ul>
    <div class="actions"><button class="btn primary" id="found-ok">收进证据板</button></div>`;
  showOverlay(html);
  $('found-ok').onclick = () => closeOverlay();
}

// 线索详情：整张卡片点开的落地页，出示也在这里做
function openClueDetail(id) {
  const g = app.game;
  const c = E.clueOf(g, id);
  if (!c) return;
  sfx.tap();
  const R = g.case.rules || {};
  const cost = R.costPresent ?? 2;
  const loc = g.case.locations.find((l) => l.clueIds.includes(id));
  const about = c.about ? E.suspectOf(g, c.about) : null;
  const s = app.active ? E.suspectOf(g, app.active) : null;
  const used = s && g.state.evidence.some((e) => e.clueId === id && e.suspectId === s.id);
  const canPresent = Boolean(s) && E.canAct(g) && g.state.timeLeft >= cost && !used;

  showOverlay(
    `<div class="clue-sheet">
      <div class="cs-top">
        <span class="clue-kind k-${c.kind}">${KIND[c.kind] || '物证'}</span>
        <span class="cs-loc">${loc ? `在「${esc(loc.name)}」找到` : '物证'}</span>
      </div>
      <h2 class="modal-h">${esc(c.name)}</h2>
      <p class="detail-text">${esc(c.detail)}</p>
      ${
        about
          ? `<p class="cs-link${c.kind === 'trace' ? ' hot' : ''}">${
              c.kind === 'trace' ? `现场痕迹 · 指向 ${esc(about.name)}` : `与 ${esc(about.name)} 的说法有关`
            }</p>`
          : ''
      }
      ${used ? `<p class="modal-sub dim">你已经向 ${esc(s.name)} 出示过这一条了，他不会再说第二遍。</p>` : ''}
      <div class="actions">
        <button class="btn ghost" id="cs-close">合上</button>
        ${
          s
            ? `<button class="btn danger" id="cs-present" ${canPresent ? '' : 'disabled'}>向 ${esc(s.name)} 出示 · ${cost}h</button>`
            : ''
        }
      </div>
    </div>`,
    { closable: true },
  );
  $('cs-close').onclick = () => closeOverlay();
  if (s && canPresent) $('cs-present').onclick = () => {
    closeOverlay();
    doPresent(id);
  };
}

function openBrief() {
  const g = app.game;
  showOverlay(`
    <h2 class="modal-h">现场简报 · ${esc(g.case.title)}</h2>
    <p class="modal-sub">${esc(g.case.venue)}　—　${esc(g.case.victim.summary)}</p>
    <ul class="timeline">
      ${g.case.timeline.map((t) => `<li><span class="tt">${t.t}</span><span>${esc(t.text)}</span></li>`).join('')}
    </ul>
    <div class="actions"><button class="btn ghost" id="brief-close">合上</button></div>`);
  $('brief-close').onclick = () => closeOverlay();
}

// ── 动作：出示证据 ─────────────────────────────────────────
function doPresent(clueId) {
  const g = app.game;
  if (!clueId || !app.active || !E.canAct(g)) return;
  const sid = app.active;
  const s = E.suspectOf(g, sid);
  const clue = E.clueOf(g, clueId);
  const res = E.presentEvidence(g, sid, clueId);
  if (!res.ok) {
    if (res.reason === 'time') ticker('时间不够了。');
    return;
  }
  pushMsg(sid, { who: 'you', text: `（把「${clue.name}」推到他面前）` });
  if (res.confessed || res.verdict === 'breaker') sfx.crack();
  else if (res.verdict === 'trace') sfx.clue();
  else sfx.hour();

  const thinking = { who: 'them', name: s.name, thinking: true, text: '' };
  pushMsg(sid, thinking);

  renderUtterance(app.settings, {
    suspect: s,
    lines: res.lines,
    mood: res.mood,
    playerText: `（警探把「${clue.name}」推到你面前）`,
    scene: sceneInfo(g),
  }).then((rendered) => {
    finishThinking(sid, { who: 'them', name: s.name, text: rendered.text, t: `剩 ${g.state.timeLeft}h` });
    const label = res.confessed
      ? '他撑不住了。'
      : res.verdict === 'breaker'
        ? '他的不在场证明塌了。'
        : res.verdict === 'trace'
          ? '他承认到过现场——但只说"就一会儿"。'
          : res.verdict === 'secret'
            ? '他认了一件和杀人无关的私事。'
            : res.verdict === 'repeat'
              ? '同样的东西，他不肯再看第二遍。'
              : res.verdict === 'deflect'
                ? '他把话头引到了别人身上。'
                : '他连看都没看。';
    ticker(label);
    save();
    renderAll({ feed: false });
  });
  app.busy = true;
  setTimeout(() => (app.busy = false), 300);
  renderEvidence();
}

// ── 动作：指控 ─────────────────────────────────────────────
function openAccuse() {
  const g = app.game;
  if (g.state.result) return openResult();
  const suspects = g.case.suspects
    .map(
      (s, i) => `
      <label class="radio-card">
        <input type="radio" name="who" value="${s.id}" ${i === 0 ? 'checked' : ''} />
        <span class="rc-portrait" style="--h:${s.hue}">${esc(s.name.slice(0, 1))}</span>
        <span class="rc-text"><b>${esc(s.name)}</b><i>${esc(s.role)}</i></span>
      </label>`,
    )
    .join('');
  const methods = E.methodOptions(g).map(
    (m, i) =>
      `<label class="radio-line"><input type="radio" name="how" value="${m.id}" ${i === 0 ? 'checked' : ''} /><span>${esc(m.label)}</span></label>`,
  ).join('');
  const motives = E.MOTIVE_OPTIONS(g)
    .map(
      (m, i) =>
        `<label class="radio-line"><input type="radio" name="why" value="${m.id}" ${i === 0 ? 'checked' : ''} /><span>${esc(m.label)}</span></label>`,
    )
    .join('');
  showOverlay(`
    <h2 class="modal-h">提起指控</h2>
    <p class="modal-sub">30 小时里，你只有这一次机会。指错人，案子就烂在你手里。</p>
    <fieldset class="fs"><legend>谁</legend><div class="pick">${suspects}</div></fieldset>
    <fieldset class="fs"><legend>手法</legend><div class="pick vertical">${methods}</div></fieldset>
    <fieldset class="fs"><legend>动机</legend><div class="pick vertical">${motives}</div></fieldset>
    <div class="actions">
      <button class="btn ghost" id="ac-cancel">再想想</button>
      <button class="btn danger" id="ac-go">签下这份指控</button>
    </div>`);
  $('ac-cancel').onclick = () => closeOverlay();
  $('ac-go').onclick = () => {
    const suspectId = document.querySelector('input[name="who"]:checked').value;
    const methodId = document.querySelector('input[name="how"]:checked').value;
    const motiveId = document.querySelector('input[name="why"]:checked').value;
    const r = E.accuse(g, { suspectId, methodId, motiveId });
    sfx[r.killerOk ? 'win' : 'fail']();
    save();
    renderAll();
    closeOverlay();
    openResult();
  };
}

function openResult() {
  const g = app.game;
  const r = g.state.result;
  if (!r) return;
  const grade = r.grade;
  showOverlay(
    `<div class="result">
      <div class="kicker">结案报告</div>
      <div class="grade-row">
        <div class="grade grade-${grade}">${grade}</div>
        <div class="score-wrap">
          <div class="score">${r.score}<span>/100</span></div>
          <div class="headline">${esc(r.headline)}</div>
        </div>
      </div>
      <ul class="breakdown">
        <li class="${r.killerOk ? 'ok' : 'bad'}"><span>指认凶手</span><b>${r.killerOk ? '+55' : '+0'}</b></li>
        <li class="${r.methodOk ? 'ok' : 'bad'}"><span>手法（${esc(r.methodName)}）</span><b>${r.methodOk ? '+18' : '+0'}</b></li>
        <li class="${r.motiveOk ? 'ok' : 'bad'}"><span>动机（${esc(r.motiveShort)}）</span><b>${r.motiveOk ? '+17' : '+0'}</b></li>
        <li class="${r.breaks > 0 ? 'ok' : 'bad'}"><span>戳破的不在场证明</span><b>+${Math.min(5, r.breaks * 5)}</b></li>
        <li class="${r.timeLeft > 0 ? 'ok' : 'bad'}"><span>剩余时间 ${r.timeLeft}h</span><b>+${Math.min(5, Math.floor(r.timeLeft / 3))}</b></li>
      </ul>
      ${
        r.proofs.length || r.traces.length
          ? `<p class="proofs">关键证据：<b>${[...r.traces, ...r.proofs].map(esc).join('</b> · <b>')}</b></p>`
          : ''
      }
      <div class="epilogue" id="epilogue"><p class="dim">正在写结案陈词……</p></div>
      <details class="truth">
        <summary>那一夜真正发生了什么</summary>
        <p class="truth-head">${esc(r.truth.headline)}</p>
        <p class="truth-why">${esc(r.truth.why)}</p>
        <ul class="timeline">
          ${r.truth.timeline.map((t) => `<li><span class="tt">${t.t}</span><span>${esc(t.text)}</span></li>`).join('')}
        </ul>
        <ul class="fates">
          ${r.truth.fates.map((f) => `<li><b>${esc(f.name)}</b><span>${esc(f.text)}</span></li>`).join('')}
        </ul>
      </details>
      <div class="actions">
        <button class="btn primary" id="rs-again">换一局</button>
        <button class="btn ghost" id="rs-close">留在案卷里</button>
      </div>
    </div>`,
    { wide: true },
  );
  $('rs-again').onclick = () => {
    closeOverlay();
    newGame();
  };
  $('rs-close').onclick = () => closeOverlay();

  if (app.epilogue) {
    $('epilogue').innerHTML = `<p>${esc(app.epilogue)}</p>`;
  } else {
    renderEpilogue(app.settings, { result: r }).then((out) => {
      app.epilogue = out.text;
      const n = $('epilogue');
      if (n) n.innerHTML = `<p>${esc(out.text)}</p>`;
    });
  }
}

// ── 设置 ───────────────────────────────────────────────────
function openSettings(backdrop) {
  const s = app.settings;
  showOverlay(
    `<h2 class="modal-h">模型设置</h2>
    <p class="modal-sub">三种模式：本地大脑（离线可玩）· 代理（密钥留在服务端）· 直连（浏览器直连 API）。</p>
    <div class="form">
      <label class="row"><span>模式</span>
        <select id="st-mode">
          <option value="local" ${s.mode === 'local' ? 'selected' : ''}>本地大脑（零配置，离线）</option>
          <option value="proxy" ${s.mode === 'proxy' ? 'selected' : ''}>本地服务代理（推荐，密钥不进浏览器）</option>
          <option value="direct" ${s.mode === 'direct' ? 'selected' : ''}>浏览器直连（需要 API 允许 CORS）</option>
        </select>
      </label>
      <label class="row"><span>Base URL</span><input id="st-base" value="${esc(s.baseUrl)}" placeholder="https://api.deepseek.com/v1" /></label>
      <label class="row"><span>模型</span><input id="st-model" value="${esc(s.model)}" placeholder="deepseek-chat" /></label>
      <label class="row"><span>API Key</span><input id="st-key" type="password" value="${esc(s.apiKey)}" placeholder="sk-…（代理模式下可留空）" /></label>
      <label class="row"><span>温度</span><input id="st-temp" type="range" min="0" max="1.4" step="0.1" value="${s.temperature}" /><b id="st-temp-v">${s.temperature}</b></label>
      <label class="row"><span>环境音</span>
        <label class="check"><input type="checkbox" id="st-audio" ${app.audio ? 'checked' : ''} /><span>雨声与低频（WebAudio 现场合成，无音频文件）</span></label>
      </label>
    </div>
    <p class="modal-sub dim">兼容任何 OpenAI 格式接口：DeepSeek、OpenAI、Ollama（http://127.0.0.1:11434/v1）、LM Studio 等。</p>
    <div class="actions">
      <button class="btn ghost" id="st-test">测试连接</button>
      <button class="btn ghost" id="st-close">取消</button>
      <button class="btn primary" id="st-save">保存</button>
    </div>
    <p class="modal-sub" id="st-msg"></p>`,
    { closable: true },
  );
  if (backdrop) backdrop.classList.add('stacked');
  $('st-temp').oninput = (e) => ($('st-temp-v').textContent = e.target.value);
  $('st-close').onclick = () => {
    closeOverlay();
    if (backdrop) openIntro();
  };
  $('st-save').onclick = () => {
    app.settings = {
      mode: $('st-mode').value,
      baseUrl: $('st-base').value.trim() || 'https://api.deepseek.com/v1',
      model: $('st-model').value.trim() || 'deepseek-chat',
      apiKey: $('st-key').value.trim(),
      temperature: Number($('st-temp').value),
    };
    saveSettings(app.settings);
    setAudio($('st-audio').checked);
    closeOverlay();
    if (!app.game) openIntro();
    else {
      renderAll();
      ticker(
        isLLM(app.settings) ? `已切到模型渲染：${app.settings.model}` : '已切回本地大脑。',
      );
    }
  };
  $('st-test').onclick = async () => {
    const probe = {
      mode: $('st-mode').value,
      baseUrl: $('st-base').value.trim(),
      model: $('st-model').value.trim(),
      apiKey: $('st-key').value.trim(),
      temperature: 0,
    };
    $('st-msg').textContent = '正在测试……';
    try {
      const t = await pingLLM(probe);
      $('st-msg').textContent = `连上了。模型回了：${t.slice(0, 40)}`;
    } catch (err) {
      $('st-msg').textContent = `失败：${err.message || err}。代理模式请确认 server.mjs 在跑、.env 里配了 key。`;
    }
  };
}

// ── 遮罩 ───────────────────────────────────────────────────
function showOverlay(html, opts = {}) {
  const ov = $('overlay');
  app.overlayClosable = opts.closable !== false;
  ov.hidden = false;
  ov.innerHTML = `<div class="modal${opts.wide ? ' wide' : ''}">${
    opts.closable === false ? '' : '<button class="close" aria-label="关闭">×</button>'
  }${html}</div>`;
  if (opts.closable !== false) {
    ov.querySelector('.close').onclick = () => closeOverlay();
    ov.onclick = (e) => {
      if (e.target === ov) closeOverlay();
    };
  }
  requestAnimationFrame(() => ov.classList.add('in'));
  return ov.firstElementChild;
}

function closeOverlay() {
  const ov = $('overlay');
  ov.classList.remove('in');
  ov.innerHTML = '';
  ov.hidden = true;
  ov.onclick = null;
  app.overlayClosable = false;
}
